<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Planta - Plant Tech</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Encabezado -->
    <header class="top-header">
        <button id="btnBack" class="icon-button">←</button>
        <h1>Detalles de la planta</h1>
    </header>

    <main class="app-container">
        <!-- Tarjeta de perfil de la planta -->
        <section class="plant-profile-card">
            <div class="plant-image-placeholder">
                <!-- Aquí irá la imagen de la planta -->
                <span>[Foto]</span>
            </div>
            <div class="plant-summary">
                <h2 id="plantName">My Lovely Plant</h2>
                <ul>
                    <li><strong>Especie:</strong> <span id="plantSpecies">Cinta</span></li>
                    <li><strong>Diagnósticos:</strong> <span id="plantDiagnosticsCount">4</span></li>
                </ul>
            </div>
        </section>

        <!-- Última Medición -->
        <section class="latest-measurement">
            <h3>Última medición</h3>
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="icon">🌡️</span>
                    <span>Temperatura</span>
                    <strong id="valTemp">24°C</strong>
                </div>
                <div class="metric-card">
                    <span class="icon">💧</span>
                    <span>Humedad</span>
                    <strong id="valHum">60%</strong>
                </div>
                <div class="metric-card">
                    <span class="icon">☀️</span>
                    <span>Luz</span>
                    <strong id="valLight">Alta</strong>
                </div>
            </div>
        </section>

        <!-- Recomendaciones -->
        <section class="recommendations">
            <h3>Recomendaciones</h3>
            <ul id="recommendationList">
                <li>Regar cada 3-4 días</li>
                <li>Proporcionar luz brillante e indirecta</li>
                <li>Fertilizar mensualmente durante la temporada de crecimiento</li>
            </ul>
        </section>

        <!-- Botones de Acción -->
        <div class="action-buttons">
            <button id="btnDiagnose" class="btn btn-primary">Diagnosticar</button>
            <button id="btnConnect" class="btn btn-secondary">Conectar a Internet</button>
        </div>
    </main>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
        <button class="nav-item active">Mis plantas</button>
        <button class="nav-item">Añadir Sensor</button>
        <button class="nav-item">Ajustes</button>
    </nav>

    <script src="app.js"></script>
    <script src="api.js"></script>
</body>
</html>
